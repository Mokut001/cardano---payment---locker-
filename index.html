<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cardano Payment Locker</title>
    <script src="https://unpkg.com/lucid-cardano/dist/lucid.bundle.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-white min-h-screen flex items-center justify-center p-4">
    <div class="max-w-md w-full bg-slate-800 rounded-3xl p-8 shadow-2xl border border-slate-700">
        <h1 class="text-3xl font-bold text-sky-400 mb-2 text-center">Payment Locker</h1>
        <p id="status" class="text-xs text-center text-slate-400 mb-6 uppercase tracking-widest italic">Preprod Network</p>

        <div class="space-y-6">
            <div class="bg-slate-900 p-4 rounded-2xl border border-slate-700">
                <p class="text-[10px] text-slate-500 uppercase">Owner PKH</p>
                <p class="text-xs font-mono text-sky-200 mt-1 truncate">e310f50a0c46db309f4e8c644...8069</p>
            </div>

            <input type="number" id="amt" placeholder="Amount (ADA)" 
                class="w-full bg-slate-900 border border-slate-700 rounded-xl p-4 text-white focus:outline-none focus:border-sky-500">
            
            <button onclick="deposit()" class="w-full bg-sky-500 hover:bg-sky-600 text-slate-900 font-bold py-4 rounded-xl transition-all shadow-lg shadow-sky-500/20">
                DEPOSIT FUNDS
            </button>
            
            <button onclick="withdraw()" class="w-full bg-transparent border border-slate-600 hover:border-sky-500 text-slate-400 hover:text-sky-400 font-semibold py-3 rounded-xl transition-all">
                WITHDRAW ALL
            </button>
        </div>

        <p class="text-[10px] text-slate-600 text-center mt-6">Only the owner PKH can unlock these funds.</p>
    </div>
    <script src="app.js"></script>
</body>
</html>
