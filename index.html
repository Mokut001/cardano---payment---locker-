<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cardano Payment Locker</title>
<link rel="stylesheet" href="style.css">
<script src="https://unpkg.com/lucid-cardano@latest/dist/lucid.js"></script>
</head>
<body>
<div class="container">
  <h2>Cardano Payment Locker</h2>

  <button onclick="connectWallet()">Connect Wallet</button>
  <h3>Deposit ADA</h3>
  <input type="number" id="amount" placeholder="Amount in ADA" />
  <button onclick="lockAda()">Lock ADA</button>

  <h3>Withdraw ADA</h3>
  <button onclick="withdrawAda()">Withdraw ADA</button>

  <p id="status"></p>
</div>
<script src="main.js"></script>
</body>
</html>
